name: Scan and publish

# Nightly: scan the top PyPI packages with wheelgap, commit the data, and publish the site.
# Pushing a change to the site (or running this by hand) republishes without waiting for the night.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      scan:
        description: Run a fresh scan before publishing
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/scan.yml"]

permissions:
  contents: read

concurrency:
  group: scan-and-publish
  cancel-in-progress: false

env:
  # The wheelgap release that produces the data. Bump it to pick up new targets.
  WHEELGAP: "wheelgap==0.4.0"
  TOP: "5000"

jobs:
  scan:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scan)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Scan
        run: uv run --no-project --with "$WHEELGAP" python -m wheelgap.scan --top "$TOP" --out data/coverage.json
      - name: Update history
        run: uv run --no-project python scripts/update_history.py data/coverage.json data/history.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Scan $(date -u +%Y-%m-%d)"
          git push

  publish:
    needs: scan
    if: ${{ !cancelled() && (needs.scan.result == 'success' || needs.scan.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # include the data the scan job just pushed
      - uses: actions/configure-pages@v6
      - name: Assemble the site
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp data/*.json _site/data/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
